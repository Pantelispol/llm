services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: tourist
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

