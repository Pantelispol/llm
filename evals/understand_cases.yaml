    kind: replay
    live_record: true
    user_turn: No museum—replace the second stop with something outdoors.
    trip_state:
      time_window:
        start: "2026-09-21T10:00:00+03:00"
        end: "2026-09-21T15:00:00+03:00"
      itinerary:
        window:
          start: "2026-09-21T10:00:00+03:00"
          end: "2026-09-21T15:00:00+03:00"
        activities:
          - poi_id: white_tower
            start: "2026-09-21T10:00:00+03:00"
            end: "2026-09-21T11:00:00+03:00"
            visit_minutes: 60
            exposure: indoor
          - poi_id: archaeological_museum
            start: "2026-09-21T11:15:00+03:00"
            end: "2026-09-21T12:45:00+03:00"
            visit_minutes: 90
            travel_from_previous_minutes: 10
            buffer_before_minutes: 5
            exposure: indoor
        total_travel_minutes: 10
      itinerary_version: 1
    expected_intent: edit_plan

  - id: opening_hours
    kind: replay
    live_record: true
    user_turn: What are the White Tower opening hours?
    trip_state: {}
    expected_intent: opening_hours_question

  - id: price
    kind: replay
    live_record: true
    user_turn: How much does admission to the Archaeological Museum cost?
    trip_state: {}
    expected_intent: price_question

  - id: malformed_output
    kind: replay
    live_record: false
    synthetic_fixture: malformed_twice
    user_turn: Tell me about Atlantis Palace.
    trip_state: {}
