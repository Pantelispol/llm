  - id: multi_roman_monuments
    query: Which Roman monuments can I visit in the city center?
    lang: en
    expected_poi_ids: [arch_of_galerius, rotunda, roman_forum]
    note: Multi-POI Roman heritage query.

  - id: multi_byzantine_churches
    query: Which Byzantine churches have mosaics?
    lang: en
    expected_poi_ids: [hagios_demetrios, hagia_sophia, rotunda]
    note: Multi-POI religious heritage query.

  - id: abstain_other_city
    query: Acropolis Athens tips
    lang: en
    expect_abstain: true
    note: Another city is outside this knowledge base.

  - id: abstain_events
    query: events tonight concerts
    lang: en
    expect_abstain: true
    note: Current events require a live source.

  - id: abstain_restaurant
    query: best restaurant recommendation
    lang: en
    expect_abstain: true
    note: Restaurant recommendations are outside the curated POI corpus.

  - id: abstain_opening_hours
    query: What are the White Tower opening hours?
    lang: en
    expect_abstain: true
    note: Operational hours belong to structured POI data, not descriptive RAG.
