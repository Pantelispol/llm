        approximate: true
    disclosures: [approximate_travel, draft_content]

  - id: operational_catalog_answer
    kind: operational
    user_question: When is the archaeological museum open and what does a ticket cost?
    weather_fixture: clear_day
    travel: precomputed
    catalog_poi_ids: [archaeological_museum]
    evidence:
      - kind: hours
        poi_id: archaeological_museum
      - kind: catalog
        poi_id: archaeological_museum
        field: admission
    disclosures: []

