[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thessaloniki-tourist-assistant"
version = "0.1.0"
description = "Production-minded prototype of a grounded Thessaloniki tourist assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "openai>=2.0,<3",
  "opening-hours-py>=2.1,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "sentence-transformers>=3.3,<4",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "integration: requires a running local integration service",
  "live: calls a real external service and is excluded by default",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
